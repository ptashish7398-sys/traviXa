<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Weather | TraviXa</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/utility.css">
</head>

<body>
    <header class="top">
        <div class="topin"><a class="brand" href="index.html"><img src="images/travixa-logo.png" alt="TraviXa"></a>
            <nav class="nav"><a href="index.html">Home</a><a href="destinations.html">Destinations</a><a
                    href="planner.html">Planner</a><a href="dashboard.html">Dashboard</a></nav><a class="btn green"
                href="dashboard.html">My Trips</a>
        </div>
    </header>
    <main class="wrap">
        <section class="hero">
            <h1>Weather</h1>
            <p class="muted">Check destination weather before finalizing your itinerary.</p>
            <div class="card" style="margin-top:22px"><input id="place" placeholder="Search a destination"
                    style="width:100%;padding:14px;border:1px solid #e5e7eb;border-radius:12px"><br><br><button
                    class="btn green" id="go">Use Destination</button>
                <p class="muted" id="status">Enter a destination to begin.</p>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="footerin">© 2026 TraviXa. All Rights Reserved.</div>
    </footer>
    <script>document.getElementById('go').onclick = () => { const p = document.getElementById('place').value.trim(); if (!p) return; localStorage.setItem('travixaMapWeatherPlace', p); document.getElementById('status').textContent = 'Weather workspace ready for ' + p + '. Live API integration can be added in the backend phase.'; };</script>
    <script src="js/auth.js"></script>
</body>

</html>
