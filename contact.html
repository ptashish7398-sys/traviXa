<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact TraviXa | TraviXa</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/utility.css"></head><body><header class="top"><div class="topin"><a class="brand" href="home.html"><img src="images/travixa-logo.png" alt="TraviXa"></a><nav class="nav"><a href="home.html">Home</a><a href="destinations.html">Destinations</a><a href="planner.html">Planner</a><a href="dashboard.html">Dashboard</a></nav><a class="btn green" href="dashboard.html">My Trips</a></div></header><main class="wrap"><section class="hero"><h1>Contact TraviXa</h1><p class="muted">Need help with your travel planning experience? Send us a message.</p></section><div class="hero"><form id="contactForm"><div class="grid"><div class="card"><label>Name<br><input id="cname" required style="width:100%;padding:12px;margin-top:8px"></label></div><div class="card"><label>Email<br><input id="cemail" type="email" required style="width:100%;padding:12px;margin-top:8px"></label></div><div class="card"><label>Subject<br><input id="csubject" required style="width:100%;padding:12px;margin-top:8px"></label></div></div><div class="card" style="margin-top:18px"><label>Message<br><textarea id="cmessage" required rows="6" style="width:100%;padding:12px;margin-top:8px"></textarea></label><br><button class="btn green" type="submit">Send Message</button></div></form></div><script>document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('travixaContactDraft',JSON.stringify({name:cname.value,email:cemail.value,subject:csubject.value,message:cmessage.value}));alert('Message saved in this frontend demo. Backend support can be connected later.');});</script></main><footer class="footer"><div class="footerin">© 2026 TraviXa. All Rights Reserved.</div></footer><script src="js/auth.js"></script></body></html>
